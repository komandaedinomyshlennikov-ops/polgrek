# Weekly: refresh LitRes buy URLs and prices in site.json, then deploy if anything changed.
name: Sync LitRes links

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync URLs and prices
        run: python3 scripts/sync-litres.py

      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git config user.name "polgrek-bot"
          git config user.email "hello@polgrek.site"
          git add web/src/data/site.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No LitRes changes"
            exit 0
          fi
          git commit -m "Автообновление ссылок и цен Литрес"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Ensure CNAME
        run: |
          set -euo pipefail
          echo "polgrek.site" > out/CNAME
          touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
