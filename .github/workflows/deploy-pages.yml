# Cutover: build Next.js (web/) → GitHub Pages (polgrek.site)
name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # quieter turbopack root warning in monorepo-ish layouts
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Ensure CNAME + no Jekyll
        run: |
          set -euo pipefail
          test -d out
          echo "polgrek.site" > out/CNAME
          touch out/.nojekyll
          # sanity: home + reader routes exist
          test -f out/index.html
          test -d out/books
          test -d out/read
          echo "out size:"; du -sh out
          ls out | head -30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
